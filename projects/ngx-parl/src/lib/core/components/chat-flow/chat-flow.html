<div class="chat">
    <div class="chat__flow" id="chatFlow">
        @for (message of message_list(); track message) {
            <div class="message"
                 [ngClass]="{
                     'message--outgoing': message.type === messageType.Outgoing,
                     'message--incoming': message.type === messageType.Incoming
                 }">
                <div class="message__avatar">
                    <img [ngSrc]="
                        message.type === messageType.Incoming
                        ? (message.avatar || './assets/icons/avatar_anonym.svg')
                        : (message.avatar || './assets/icons/avatar_manager.svg')
                    "
                         width="36"
                         height="36"
                         alt="avatar"
                    />
                </div>

                <div class="message__body">
                    @if (message.file_path) {
                        <div class="message__attachments">
                            @for (file of (message.file_path || '').split(','); track file) {
                                <img [ngSrc]="file.trim()"
                                     width="140"
                                     height="140"
                                     alt="attachment"
                                     class="message__image"
                                />
                                <div class="message__bubble"
                                     tabindex="0"
                                     (click)="message.edit = true"
                                     (blur)="message.edit = false"
                                     [attr.contenteditable]="message.edit">
                                    {{ message.content }}
                                </div>
                            }
                        </div>
                    } @else {
                        <div class="message__bubble"
                             tabindex="0"
                             (click)="message.edit = true"
                             (blur)="message.edit = false"
                             [attr.contenteditable]="message.edit">
                            {{ message.content }}
                        </div>
                    }

                    <div class="message__meta">
                        <time class="message__time">{{ message.cr_time }}</time>
                    </div>
                </div>
            </div>
        }
    </div>
</div>
