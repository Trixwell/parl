<div class="preview"
     [class.preview--mobile]="mobileMode()"
     (click)="requestClose()">
    <div class="preview__dialog"
         #dialog
         tabindex="-1"
         role="dialog"
         aria-modal="true"
         [attr.aria-label]="title() || ('chat.photo_preview' | transloco: {__: language()}: language())"
         (keydown)="onKeyDown($event)"
         (click)="$event.stopPropagation()">
        <div class="preview__header">
            <h3 class="preview__title">
                {{ title() || ('chat.photo_preview' | transloco: {__: language()}: language()) }}
            </h3>
            <button type="button"
                    class="preview__close"
                    [attr.aria-label]="'chat.close' | transloco: {__: language()}: language()"
                    #closeButton
                    (click)="requestClose()">
                <span class="preview__close-icon" aria-hidden="true"></span>
            </button>
        </div>
        <div class="preview__body">
            @if (srcList().length > 1) {
                <button type="button"
                        class="preview__nav preview__nav--prev"
                        [attr.aria-label]="'chat.previous' | transloco: {__: language()}: language()"
                        (click)="prev()">
                </button>
                <button type="button"
                        class="preview__nav preview__nav--next"
                        [attr.aria-label]="'chat.next' | transloco: {__: language()}: language()"
                        (click)="next()">
                </button>
            }
            <div class="preview__viewport"
                 #viewport
                 (pointerdown)="onViewportPointerDown($event)"
                 (pointermove)="onViewportPointerMove($event)"
                 (pointerup)="onViewportPointerUp($event)"
                 (pointercancel)="onViewportPointerUp($event)">
                <img [src]="currentSrc()"
                     #previewImage
                     draggable="false"
                     [attr.alt]="'chat.photo_preview_image_x_of_y' | transloco: { index: activeIndex() + 1, total: srcList().length, __: language() }: language()"
                     class="preview__image"
                     [class.preview__image--zoomed]="isZoomed()"
                     [style.transform]="imageTransform()"
                     (click)="onImageClick($event)"
                     (keydown.enter)="$event.preventDefault(); next()"
                     (keydown.space)="$event.preventDefault(); next()"/>
            </div>
        </div>
        @if (srcList().length > 1) {
            <div class="preview__thumbs">
                @for (file of srcList(); track file; let i = $index) {
                    <button type="button"
                            class="preview__thumb"
                            [class.preview__thumb--active]="i === activeIndex()"
                            (click)="select(i)">
                        <img [src]="file"
                             [attr.alt]="'chat.thumbnail_alt' | transloco: { index: i + 1, total: srcList().length, __: language() }: language()"/>
                    </button>
                }
            </div>
        }
    </div>
</div>
