<div class="preview" (click)="requestClose()">
    <div class="preview__dialog"
         #dialog
         tabindex="-1"
         role="dialog"
         aria-modal="true"
         [attr.aria-label]="title() || ('chat.photo_preview' | transloco)"
         (click)="$event.stopPropagation()">
        <div class="preview__header">
            <h3 class="preview__title">
                {{ title() || ('chat.photo_preview' | transloco) }}
            </h3>
            <button type="button"
                    class="preview__close"
                    [attr.aria-label]="'chat.close' | transloco"
                    #closeButton
                    (click)="requestClose()">
                <span class="preview__close-icon" aria-hidden="true"></span>
            </button>
        </div>
        <div class="preview__body">
            @if (srcList().length > 1) {
                <button type="button"
                        class="preview__nav preview__nav--prev"
                        [attr.aria-label]="'chat.previous' | transloco"
                        (click)="prev()">
                </button>
                <button type="button"
                        class="preview__nav preview__nav--next"
                        [attr.aria-label]="'chat.next' | transloco"
                        (click)="next()">
                </button>
            }
            <img [src]="currentSrc()"
                 [attr.alt]="'chat.photo_preview_image_x_of_y' | transloco : { index: activeIndex() + 1, total: srcList().length }"
                 class="preview__image"
                 (click)="next()"
                 (keydown.enter)="$event.preventDefault(); next()"
                 (keydown.space)="$event.preventDefault(); next()"/>
        </div>
        @if (srcList().length > 1) {
            <div class="preview__thumbs">
                @for (file of srcList(); track file; let i = $index) {
                    <button type="button"
                            class="preview__thumb"
                            [class.preview__thumb--active]="i === activeIndex()"
                            (click)="select(i)">
                        <img [src]="file"
                             [attr.alt]="'chat.thumbnail_alt' | transloco : { index: i + 1, total: srcList().length }"/>
                    </button>
                }
            </div>
        }
    </div>
</div>
