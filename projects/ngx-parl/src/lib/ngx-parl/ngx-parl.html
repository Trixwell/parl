<div class="modal-chat"
     [class.modal-chat--fill]="isFillLayout()"
     [ngClass]="'flow-theme-' + theme()">
    <div class="modal-chat__body">
        @if (header()) {
            <header class="modal-chat__header" mat-dialog-title>
                <div class="modal-chat__hide-block"></div>

                <div class="modal-chat__title">
                    <h1 class="modal-chat__heading" id="modal-chat__heading">
                        @if (transportTypeIconSrc()) {
                            <img [ngSrc]="transportTypeIconSrc()"
                                 class="modal-chat__heading-icon"
                                 width="20"
                                 height="20"
                                 [attr.alt]="transportType() || 'transport icon'"/>
                        }
                        <span class="modal-chat__heading-text">
                            {{ transportType() }} {{ incomingUser() }}
                        </span>
                    </h1>
                </div>

                <div class="modal-chat__actions">
                    <img [src]="parlAssets.icon('hide.svg')" class="modal-chat__icon modal-chat__icon--hide"
                         width="24" height="24" alt="hide"
                         (click)="onHideClick()"/>
                    <img [src]="parlAssets.icon('close.svg')" class="modal-chat__icon modal-chat__icon--close"
                         width="24" height="24" alt="close"
                         (click)="onCloseClick()"/>
                </div>
            </header>
        }

        <mat-dialog-content class="modal-chat__content"
                            [class.modal-chat__content--header]="header() === false"
                            [class.modal-chat__content--dragover]="dragActive()"
                            (dragenter)="onDragEnter($event)"
                            (dragover)="onDragOver($event)"
                            (dragleave)="onDragLeave($event)"
                            (drop)="onDrop($event)">
            @if (dragActive()) {
                <div class="modal-chat__drag-overlay"
                     role="status"
                     aria-live="polite"
                     [attr.aria-label]="'chat.drag_title' | transloco: {__: language()}: language()">
                    <div class="modal-chat__drag-card">
                        <img [src]="parlAssets.icon('attach-filled.svg')"
                             class="modal-chat__drag-icon"
                             alt=""
                             width="56"
                             height="56"/>

                        <div class="modal-chat__drag-title">
                            {{ 'chat.drag_title' | transloco: {__: language()}: language() }}
                        </div>
                        <div class="modal-chat__drag-subtitle">
                            {{ 'chat.drag_subtitle' | transloco: {__: language()}: language() }}
                        </div>
                    </div>
                </div>
            }
            <app-chat-flow [messageListInput]="messageList()"
                           [(selectedForEdit)]="selectedForEdit"
                           (requestDeleteChange)="onRequestDelete($event)"
                           [language]="language()"
                           [logoChat]="logoChat()"
                           [incomingAvatar]="incomingAvatar()"
                           [mobileMode]="mobileMode()"
                           [hasMoreHistory]="hasMoreHistory()"
                           [quickActionsWhen]="quickActionsWhen()"
                           [quickActionsResolver]="quickActionsResolver()"
                           [quickActionClick]="quickActionClick()"
                           (quickActionClickChange)="onQuickActionClick($event)"
                           [(scrollToBottomTrigger)]="scrollToBottomTrigger"
                           [(loadHistory)]="loadHistory">
            </app-chat-flow>

            <app-input-message [editMessage]="selectedForEdit()"
                               [language]="language()"
                               [autoFocus]="autoFocus()"
                               [mobileMode]="mobileMode()"
                               [(emojiPickerOpen)]="emojiPickerOpen"
                               (cancelEditChange)="onCancelEdit($event)"
                               (input_textChange)="sendMessage($event)">
                @if (ai_run_in_progress) {
                    <mat-spinner [diameter]="30"></mat-spinner>
                }
            </app-input-message>
        </mat-dialog-content>
    </div>
</div>
