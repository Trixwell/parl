<div class="modal-chat" [ngClass]="'flow-theme-' + theme()">
    <div class="modal-chat__body">
        @if (header()) {
            <header class="modal-chat__header" mat-dialog-title>
                <div class="modal-chat__hide-block"></div>

                <div class="modal-chat__title">
                    <h1 class="modal-chat__heading" id="modal-chat__heading">
                        {{ 'chat.title' | transloco }} {{ incomingUser() }}
                    </h1>
                </div>

                <div class="modal-chat__actions">
                    <img ngSrc="assets/ngx-parl/icons/hide.svg" class="modal-chat__icon modal-chat__icon--hide"
                         width="24" height="24" alt="hide" priority
                         (click)="onHideClick()"/>
                    <img ngSrc="assets/ngx-parl/icons/close.svg" class="modal-chat__icon modal-chat__icon--close"
                         width="24" height="24" alt="close" priority
                         (click)="onCloseClick()"/>
                </div>
            </header>
        }

        <mat-dialog-content class="modal-chat__content"
                            [class.modal-chat__content--header]="header() === false"
                            [class.modal-chat__content--dragover]="dragActive()"
                            (dragenter)="onDragEnter($event)"
                            (dragover)="onDragOver($event)"
                            (dragleave)="onDragLeave($event)"
                            (drop)="onDrop($event)">
            @if (dragActive()) {
                <div class="modal-chat__drag-overlay"
                     role="status"
                     aria-live="polite"
                     [attr.aria-label]="'chat.drag_title' | transloco">
                    <div class="modal-chat__drag-card">
                        <img ngSrc="assets/ngx-parl/icons/attach-filled.svg"
                             class="modal-chat__drag-icon"
                             alt=""
                             width="56"
                             height="56"
                             priority/>

                        <div class="modal-chat__drag-title">
                            {{ 'chat.drag_title' | transloco }}
                        </div>
                        <div class="modal-chat__drag-subtitle">
                            {{ 'chat.drag_subtitle' | transloco }}
                        </div>
                    </div>
                </div>
            }
            <app-chat-flow [messageListInput]="messageList()"
                           [(selectedForEdit)]="selectedForEdit"
                           (requestDeleteChange)="onRequestDelete($event)"
                           [(scrollToBottomTrigger)]="scrollToBottomTrigger"
                           [(loadHistory)]="loadHistory">
            </app-chat-flow>

            <app-input-message [editMessage]="selectedForEdit()"
                               (cancelEditChange)="onCancelEdit($event)"
                               (input_textChange)="sendMessage($event)">
                @if (ai_run_in_progress) {
                    <mat-spinner [diameter]="30"></mat-spinner>
                }
            </app-input-message>
        </mat-dialog-content>
    </div>
</div>
